name: Monthly Retraining & Autopilot Model Evaluation

on:
  schedule:
    # Run at 00:00 UTC on the 1st day of every month
    - cron: '0 0 1 * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  monthly-retrain:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies from lockfile
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock

      - name: Run Governed Row Promotion Audit & Apply
        run: |
          python scripts/promote_forward_rows.py --apply

      - name: Execute Monthly Retraining, Shadow Registration & Promotion Engine
        run: |
          python -m opi.retrain --execute

      - name: Execute Walk-Forward Comparison Report
        run: |
          python scripts/retrain_challenger.py --no-rolling --report docs/monthly_challenger_comparison.md

      - name: Run Test Suite and Independent Verification (D-093, D-107)
        run: |
          set -o pipefail
          python -m pytest -q
          python scripts/verify_all.py

      - name: Direct Push Retrained Shadow Model and Decisions to main (D-107, D-108)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ipo_master.csv
          if [ -f data/promotions.csv ]; then
            git add data/promotions.csv
          fi
          git add model/registry.json
          if [ -d model/challengers ]; then
            git add model/challengers/
          fi
          if [ -f model/promotions_log.csv ]; then
            git add model/promotions_log.csv
          fi
          git add docs/monthly_challenger_comparison.md

          if git diff --staged --quiet; then
            echo "No changes staged. Working tree is clean; nothing to push."
          else
            git commit -m "retrain(auto): monthly shadow model retraining and promotion evaluation [skip ci]"
            git push origin main
            echo "Successfully pushed retrained shadow model and promotion log directly to main."
          fi

      - name: Alert on Failure (D-091, D-107)
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create --title "ALERT: Monthly retraining workflow failed on main" \
                          --body "The scheduled monthly retraining run \`${{ github.run_id }}\` failed.\n\nCheck workflow execution logs for details: https://github.com/soul991/OPI/actions/runs/${{ github.run_id }}" || true

      - name: Archive Challenger Evaluation Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: challenger-evaluation-report
          path: |
            docs/monthly_challenger_comparison.md
            model/promotions_log.csv
            model/registry.json
