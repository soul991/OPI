name: OPI Telegram Alert Notification Runner

on:
  workflow_dispatch:
    inputs:
      stage:
        description: 'Notification stage to execute'
        required: true
        default: 'announce'
        type: choice
        options:
          - announce
          - preview
          - listing
      dry_run:
        description: 'Dry run execution (test logic without dispatching Telegram message)'
        required: false
        default: false
        type: boolean
      force_fail:
        description: 'Force execution failure to test alerting'
        required: false
        default: false
        type: boolean

concurrency:
  group: opi-predictions-writer
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  run-notify:
    runs-on: ubuntu-24.04
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_RUN_ID: ${{ github.run_id }}

    steps:
      - name: Check out repository
        id: checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        id: setup_python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies from lockfile
        id: install_deps
        run: |
          set -o pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.lock

      - name: Check Forced Failure Flag
        id: check_forced_failure
        if: "${{ github.event.inputs.force_fail == 'true' || github.event.inputs.force_fail == true }}"
        run: |
          echo "Forced failure requested via workflow_dispatch input."
          exit 1

      - name: Verify Model Binary Exists
        id: verify_model
        run: |
          if [ ! -f "model/ipo_model_phase4.joblib" ] && [ ! -f "model/ipo_model.joblib" ]; then
            python model/train.py
          fi

      - name: Execute Stage Notification Runner
        id: run_notify_stage
        run: |
          STAGE_ARG="${{ github.event.inputs.stage }}"
          DRY_ARG=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ] || [ "${{ github.event.inputs.dry_run }}" = true ]; then
            DRY_ARG="--dry-run"
          fi
          python -m opi.notify_run --stage "$STAGE_ARG" $DRY_ARG

      - name: Run Pytest
        id: run_pytest
        run: |
          pytest -q

      - name: Run Verification Checks
        id: run_verify
        run: |
          python scripts/verify_all.py --no-tests

      - name: Commit and Push State Updates
        id: commit_push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # Stage data files only
          git add predictions/alerts_sent.csv predictions/preview_log.csv 2>/dev/null || true
          git add data/evidence/ 2>/dev/null || true

          if git diff --staged --quiet; then
            echo "No state updates to commit."
          else
            git commit -m "chore(auto): update alert state and preview logs [stage: ${{ github.event.inputs.stage }}] [skip ci]"
            for attempt in 1 2 3; do
              if git pull --rebase origin main && git push origin main; then
                echo "Successfully pushed alert state updates."
                break
              else
                echo "Push conflict, retrying rebase (attempt $attempt)..."
                sleep 2
              fi
            done
          fi

      - name: Auto-close open failure alerts on success
        if: success()
        run: |
          python scripts/manage_alerts.py --on-success --run-id "${{ github.run_id }}" --workflow-name "notify.yml" || true

      - name: Alert on Failure
        if: failure()
        run: |
          # 1. Dispatch Telegram failure alert
          python -m opi.notify --message "⚠️ OPI Alert Runner Failed: stage=${{ github.event.inputs.stage }}, run_id=${{ github.run_id }}." || true
          
          # 2. File GitHub Issue using existing manage_alerts flow
          python scripts/manage_alerts.py --on-failure \
            --run-id "${{ github.run_id }}" \
            --workflow-name "notify.yml" \
            --failed-step "Alert Runner (${{ github.event.inputs.stage }})" \
            --reason "Workflow notify.yml failed at stage ${{ github.event.inputs.stage }}. Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" || true
