name: Daily Forward Test & Verification

on:
  schedule:
    # Run twice daily: 06:00 UTC (11:30 IST) and 14:00 UTC (19:30 IST, post-bidding close)
    - cron: '0 6,14 * * *'
  workflow_dispatch:
    inputs:
      force_fail:
        description: 'Force execution failure to test alerting (ignored on schedule)'
        required: false
        default: false
        type: boolean

concurrency:
  group: daily-forward-test
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  run-forward-test:
    runs-on: ubuntu-24.04
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Check out repository
        id: checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        id: setup_python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies from lockfile
        id: install_deps
        run: |
          set -o pipefail
          python -m pip install --upgrade pip 2>&1 | tee step_output.txt
          pip install -r requirements.lock 2>&1 | tee -a step_output.txt

      - name: Check Forced Failure Flag
        id: check_forced_failure
        if: "${{ github.event.inputs.force_fail == 'true' || github.event.inputs.force_fail == true }}"
        run: |
          echo "Forced failure requested via workflow_dispatch input." | tee step_output.txt
          exit 1

      - name: Verify or Retrain Model Binary
        id: verify_or_retrain_model
        run: |
          set -o pipefail
          if [ ! -f "model/ipo_model_phase4.joblib" ] && [ ! -f "model/ipo_model.joblib" ]; then
            echo "Model binary missing, running deterministic build..." | tee step_output.txt
            python model/train.py 2>&1 | tee -a step_output.txt
          fi

      - name: Execute Daily Forward Test Runner
        id: run_daily
        run: |
          set -o pipefail
          python -m opi.run_daily 2>&1 | tee step_output.txt

      - name: Run Test Suite
        id: run_tests
        run: |
          set -o pipefail
          python -m pytest -q 2>&1 | tee step_output.txt

      - name: Run Independent Repository Verification
        id: verify_all
        run: |
          set -o pipefail
          python scripts/verify_all.py 2>&1 | tee step_output.txt

      - name: Commit and Push Updated Predictions & Dashboard
        id: commit_and_push
        run: |
          set -o pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add predictions/ dashboard/ data/evidence/
          if git diff --staged --quiet; then
            echo "No new forward predictions or actuals to commit." | tee step_output.txt
          else
            git commit -m "chore(auto): daily forward test predictions and dashboard update [skip ci]" 2>&1 | tee step_output.txt
            git push 2>&1 | tee -a step_output.txt
          fi

      - name: Alert on Failure
        id: alert_on_failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          FAILED_STEP="Execution"
          if [ "${{ steps.check_forced_failure.outcome }}" = "failure" ]; then
            FAILED_STEP="Check Forced Failure Flag"
          elif [ "${{ steps.install_deps.outcome }}" = "failure" ]; then
            FAILED_STEP="Install dependencies from lockfile"
          elif [ "${{ steps.verify_or_retrain_model.outcome }}" = "failure" ]; then
            FAILED_STEP="Verify or Retrain Model Binary"
          elif [ "${{ steps.run_daily.outcome }}" = "failure" ]; then
            FAILED_STEP="Execute Daily Forward Test Runner"
          elif [ "${{ steps.run_tests.outcome }}" = "failure" ]; then
            FAILED_STEP="Run Test Suite"
          elif [ "${{ steps.verify_all.outcome }}" = "failure" ]; then
            FAILED_STEP="Run Independent Repository Verification"
          elif [ "${{ steps.commit_and_push.outcome }}" = "failure" ]; then
            FAILED_STEP="Commit and Push Updated Predictions & Dashboard"
          fi

          if [ -f step_output.txt ]; then
            tail -n 40 step_output.txt > failed_step_reason.txt
          else
            echo "Step exited with non-zero status" > failed_step_reason.txt
          fi

          python scripts/manage_alerts.py --on-failure \
            --run-id "${{ github.run_id }}" \
            --workflow-name "daily.yml" \
            --failed-step "$FAILED_STEP" \
            --reason-file failed_step_reason.txt"

      - name: Close Open Alerts on Success
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/manage_alerts.py --on-success --run-id "${{ github.run_id }}" --workflow-name "daily.yml"
