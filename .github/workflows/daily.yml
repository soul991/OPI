name: Daily Forward Test & Verification

on:
  schedule:
    # Run twice daily: 06:00 UTC (11:30 IST) and 14:00 UTC (19:30 IST, post-bidding close)
    - cron: '0 6,14 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-forward-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Daily Forward Test Runner
        run: |
          python -m opi.run_daily

      - name: Run Test Suite
        run: |
          pytest -q

      - name: Run Independent Repository Verification
        run: |
          python scripts/verify_all.py

      - name: Commit and Push Updated Predictions & Dashboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add predictions/ dashboard/ data/evidence/
          if git diff --staged --quiet; then
            echo "No new forward predictions or actuals to commit."
          else
            git commit -m "chore(auto): daily forward test predictions and dashboard update [skip ci]"
            git push
          fi
