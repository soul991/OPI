name: Probe Outcome Sources

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies from lockfile
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock

      - name: Run Source Reachability Probe
        run: |
          python scripts/probe_sources.py

      - name: Display probe output
        run: |
          cat "phases/Phase 14/source_probe.md"
