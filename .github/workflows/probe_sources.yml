name: Probe Outcome Sources

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies from lockfile
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock

      - name: Run Source Reachability Probe
        run: |
          python scripts/probe_sources.py --output "phases/Phase 15/source_probe_runner.md"
          cat "phases/Phase 15/source_probe_runner.md" >> $GITHUB_STEP_SUMMARY

      - name: Upload probe artifact
        uses: actions/upload-artifact@v4
        with:
          name: source-probe-runner
          path: phases/Phase 15/source_probe_runner.md

      - name: Commit and Push Runner Probe
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "phases/Phase 15/source_probe_runner.md"
          if git diff --staged --quiet; then
            echo "No changes to source_probe_runner.md"
          else
            git commit -m "chore(probe): commit cloud runner probe output [skip ci]"
            git push
          fi
